name = "fricas_symbolic"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FricasSymbolic"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "FricasSymbolic"
